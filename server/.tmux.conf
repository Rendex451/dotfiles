# ============ Общие настройки ============
set -g mouse on
set -g prefix M-a

set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1

# ============ Цвета ============
# Без этого tmux по умолчанию режет truecolor до 256 цветов, даже если
# и локальный терминал, и nvim (termguicolors=true) его поддерживают.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
